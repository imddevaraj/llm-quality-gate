provider:
  model: gpt-4o-mini
  prompt: |
    Summarize this support request in one concise sentence:
    {input}
  temperature: 0.0
  max_tokens: 100
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
policy:
  thresholds:
    quality_drop: 0.03
    json_validity_min: 0.99
    p95_latency_increase: 0.20
    cost_increase: 0.15
